spring.main.web-application-type=none
spring.main.banner-mode=off
logging.level.root=ERROR
generator.output-directory=generated
sync.h2.db=false
sync.h2.jdbc-url=jdbc:h2:file:./data/robot-generator
#sync.h2.jdbc-url=jdbc:h2:file:C:/sandbox/sts-workspace/robot-test-generator/data/robot-generator;IFEXISTS=TRUE;AUTO_SERVER=TRUE
sync.h2.username=sa
sync.h2.password=
sync.h2.poll-interval-ms=120000
sync.h2.jenkins-timeout-ms=7200000
auto.sync.eim.git=true
git.repo.url=https://github
my.username=${MVNW_USERNAME}
my.password=${MVNW_PASSWORD}
my.pat.token.confluence=${MVNW_PAT_TOKEN_CONFLUENCE}
jenkins.api.token=${MVNW_JENKINS_TOKEN_API}
confluence.url=https://confluence
evidence.webdriver.url=${SELENIUM_GRID_URL}
evidence.webdriver.browser=${SELENIUM_GRID_BROWSER:edge}
evidence.source=jenkins-artifact
#evidence.source=github-pages
evidence.image.mode=${EVIDENCE_IMAGE_MODE:robot-summary}
#evidence.image.mode=${EVIDENCE_IMAGE_MODE:screenshot}
evidence.report.url=${JENKINS_REPORT_URL:}
evidence.screenshot.url=/log.html
